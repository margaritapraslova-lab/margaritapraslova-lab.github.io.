<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Праслова Маргарита — Реабилитолог</title>
  <meta name="description" content="Праслова Маргарита — специалист по физической реабилитации, реабилитолог.">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f4f4f5;
      --muted: #b4c4bc;
      --e1: #a7f3d0;  /* светлый изумруд */
      --e2: #34d399;  /* изумруд */
      --e3: #10b981;  /* насыщенный изумруд */
      --e4: #047857;  /* тёмный изумруд */
      --emerald: linear-gradient(135deg, var(--e1) 0%, var(--e2) 35%, var(--e3) 65%, var(--e4) 100%);
      --tg: #29b6f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(4, 120, 87, 0.22), transparent 70%),
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(16, 185, 129, 0.10), transparent 70%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Позвоночник по центру, на всю высоту ---------- */
    /* Картинка инвертируется (белый фон → чёрный), окрашивается
       изумрудным градиентом через multiply, а вся группа через screen
       растворяет чёрное в странице — остаётся только сам скелет. */
    .spine {
      position: fixed;
      top: 0;
      left: 50%;
      height: 100vh;
      height: 100dvh;
      aspect-ratio: 635 / 1000;
      max-width: 100vw;
      transform: translateX(-50%);
      background: #000;
      isolation: isolate;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 0;
      animation: spineIn 1.8s ease both;
    }
    .spine img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: invert(1) contrast(1.35) brightness(1.15);
    }
    .spine::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--e1) 0%, var(--e2) 40%, var(--e3) 70%, var(--e4) 100%);
      mix-blend-mode: multiply;
    }
    @keyframes spineIn {
      from { opacity: 0; transform: translateX(-50%) scale(1.04); }
      to   { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    /* ---------- Летающие кости и позвонки ---------- */
    .bones {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }
    .bone {
      position: absolute;
      top: 0;
      left: var(--x);
      width: var(--s);
      height: var(--s);
      color: var(--c);
      opacity: var(--o);
      animation: rise var(--d) linear var(--delay) infinite;
      will-change: transform;
    }
    .bone svg {
      width: 100%;
      height: 100%;
      animation: wobble var(--w) ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.35));
    }
    @keyframes rise {
      from { transform: translateY(110vh) rotate(0deg); }
      to   { transform: translateY(-25vh) rotate(var(--r)); }
    }
    @keyframes wobble {
      from { transform: translateX(-18px) rotate(-14deg); }
      to   { transform: translateX(18px) rotate(14deg); }
    }

    /* Свечение за курсором */
    .spotlight {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(52, 211, 153, 0.08), transparent 60%);
    }

    /* ---------- Содержимое на всю страницу ---------- */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      text-align: center;
    }
    .content {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .content > * { animation: appear 0.9s cubic-bezier(.2, .8, .2, 1) both; }
    .content > *:nth-child(2) { animation-delay: 0.1s; }
    .content > *:nth-child(3) { animation-delay: 0.2s; }
    .content > *:nth-child(4) { animation-delay: 0.3s; }
    .content > *:nth-child(5) { animation-delay: 0.4s; }
    .content > *:nth-child(6) { animation-delay: 0.5s; }
    .content > *:nth-child(7) { animation-delay: 0.6s; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: none; }
    }

    /* Фото в изумрудном кольце */
    .avatar {
      position: relative;
      width: 172px;
      height: 172px;
      margin-bottom: 28px;
      border-radius: 50%;
    }
    /* Мягкое пульсирующее сияние вокруг */
    .avatar::after {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.45), transparent 70%);
      z-index: -1;
      animation: halo 3.5s ease-in-out infinite;
    }
    /* Вращающееся градиентное кольцо */
    .avatar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--e1), var(--e3), var(--e4), var(--e2), var(--e1));
      animation: spin 6s linear infinite;
    }
    .avatar img {
      position: absolute;
      inset: 5px;
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0a0a0a;
      transition: transform 0.5s cubic-bezier(.2, .8, .2, 1);
    }
    .avatar:hover img { transform: scale(1.04); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes halo {
      0%, 100% { opacity: 0.55; transform: scale(0.96); }
      50%      { opacity: 1;    transform: scale(1.04); }
    }

    /* Имя с изумрудным свечением */
    .name {
      position: relative;
      font-size: clamp(36px, 9vw, 56px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }
    .name .text,
    .name .glow {
      display: block;
      background: linear-gradient(90deg, var(--e1), var(--e2), var(--e3), var(--e4), var(--e3), var(--e2), var(--e1));
      background-size: 300% 100%;
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      animation: shimmer 8s linear infinite;
    }
    .name .glow {
      position: absolute;
      inset: 0;
      filter: blur(20px);
      z-index: -1;
      animation: shimmer 8s linear infinite, pulse 3s ease-in-out infinite;
    }
    @keyframes shimmer {
      from { background-position: 0% 50%; }
      to   { background-position: 300% 50%; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }

    .role {
      color: var(--text);
      font-size: 17px;
      line-height: 1.55;
      margin-bottom: 12px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
    }
    .badge {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #06281d;
      background: var(--emerald);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }

    .divider {
      width: 70%;
      height: 1px;
      margin: 34px 0 30px;
      background: linear-gradient(90deg, transparent, rgba(52, 211, 153, 0.55), transparent);
    }

    /* Иконки соцсетей */
    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 30px;
    }
    .social {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: var(--e1);
      background: rgba(6, 40, 29, 0.75);
      border: 1px solid rgba(52, 211, 153, 0.35);
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      transition: transform 0.3s cubic-bezier(.3, 1.6, .5, 1), color 0.3s, background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .social svg { width: 26px; height: 26px; transition: transform 0.4s; }
    .social:hover,
    .social:focus-visible {
      transform: translateY(-6px) scale(1.08);
      color: #fff;
      outline: none;
    }
    .social.tg:hover,
    .social.tg:focus-visible {
      background: var(--tg);
      border-color: var(--tg);
      box-shadow: 0 12px 30px rgba(41, 182, 246, 0.45);
    }
    .social.tg:hover svg { transform: rotate(-12deg); }
    .social.copy:hover,
    .social.copy:focus-visible {
      color: #06281d;
      background: var(--emerald);
      border-color: var(--e2);
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.5);
    }

    /* Всплывающая подсказка */
    .social .tip {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      white-space: nowrap;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #0b1a14;
      color: var(--text);
      border: 1px solid rgba(52, 211, 153, 0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .social:hover .tip,
    .social:focus-visible .tip,
    .social.copied .tip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Кнопка «Написать мне» */
    .cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      padding: 18px 28px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      color: #04261b;
      text-decoration: none;
      background: linear-gradient(90deg, var(--e1), var(--e2), var(--e3), var(--e2), var(--e1));
      background-size: 300% 100%;
      overflow: hidden;
      animation: shimmer 6s linear infinite, breathe 2.8s ease-in-out infinite;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .cta svg { width: 20px; height: 20px; transition: transform 0.35s cubic-bezier(.3, 1.6, .5, 1); }
    .cta:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(16, 185, 129, 0.55); }
    .cta:hover svg { transform: translateX(5px) rotate(-10deg); }
    .cta:active { transform: scale(0.97); }
    .cta:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* Бегущий блик */
    .cta::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: skewX(-20deg);
      animation: sheen 3.5s ease-in-out infinite;
    }
    @keyframes sheen {
      0%, 60% { left: -60%; }
      100%    { left: 130%; }
    }
    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45); }
      50%      { box-shadow: 0 0 0 12px rgba(52, 211, 153, 0); }
    }

    /* Волна от клика */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      transform: scale(0);
      animation: ripple 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }

    .handle {
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
    .handle a { color: var(--e1); text-decoration: none; border-bottom: 1px dashed rgba(167, 243, 208, 0.4); }
    .handle a:hover { color: #fff; border-color: #fff; }

    /* Телефоны */
    @media (max-width: 480px) {
      .avatar { width: 144px; height: 144px; margin-bottom: 24px; }
      .role { font-size: 16px; }
    }

    /* Для тех, у кого отключены анимации в системе */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .bones { display: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      // Летающие кости и позвонки
      var bones = document.getElementById('bones');
      var shapes = ['i-bone', 'i-vertebra', 'i-vertebra-side', 'i-disc', 'i-vertebra', 'i-bone'];
      var colors = ['#a7f3d0', '#6ee7b7', '#34d399', '#10b981'];
      var count = window.innerWidth < 600 ? 12 : 22;
      function rand(a, b) { return a + Math.random() * (b - a); }

      if (!reduceMotion) {
        for (var i = 0; i < count; i++) {
          var el = document.createElement('div');
          el.className = 'bone';
          var dur = rand(22, 45);
          el.style.setProperty('--x', rand(-4, 96) + '%');
          el.style.setProperty('--s', Math.round(rand(26, 70)) + 'px');
          el.style.setProperty('--c', colors[i % colors.length]);
          el.style.setProperty('--o', rand(0.14, 0.32).toFixed(2));
          el.style.setProperty('--d', dur + 's');
          el.style.setProperty('--delay', (-rand(0, dur)) + 's');
          el.style.setProperty('--r', (Math.random() < 0.5 ? -1 : 1) * Math.round(rand(180, 540)) + 'deg');
          el.style.setProperty('--w', rand(3, 7) + 's');
          el.innerHTML = '<svg><use href="#' + shapes[i % shapes.length] + '"></use></svg>';
          bones.appendChild(el);
        }
      }

      // Свечение за курсором — только на компьютере
      var spotlight = document.getElementById('spotlight');
      if (finePointer && !reduceMotion) {
        document.addEventListener('mousemove', function (e) {
          spotlight.style.setProperty('--mx', e.clientX + 'px');
          spotlight.style.setProperty('--my', e.clientY + 'px');
        });
      }

      // Волна от клика по кнопке
      var cta = document.getElementById('cta');
      cta.addEventListener('click', function (e) {
        var r = cta.getBoundingClientRect();
        var size = Math.max(r.width, r.height);
        var ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - r.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - r.top - size / 2) + 'px';
        cta.appendChild(ripple);
        setTimeout(function () { ripple.remove(); }, 650);
      });

      // Копирование ника
      var copyBtn = document.getElementById('copyBtn');
      var copyTip = document.getElementById('copyTip');
      var handle = '@margarita_2305_r';

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        ta.remove();
      }

      copyBtn.addEventListener('click', function () {
        var done = function () {
          copyTip.textContent = 'Скопировано ✓';
          copyBtn.classList.add('copied');
          setTimeout(function () {
            copyTip.textContent = 'Скопировать ник';
            copyBtn.classList.remove('copied');
          }, 1600);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(handle).then(done, function () { fallbackCopy(handle); done(); });
        } else {
          fallbackCopy(handle);
          done();
        }
      });
    })();
  </script>
